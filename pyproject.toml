[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus-logs"
version = "0.1.0"
description = "Log anomaly detection with optional LLM incident summaries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "typer>=0.12",
    "rich>=13.7",
    "anthropic>=0.40",
    "openai>=1.50",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
argus = "argus.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"src/argus/llm/prompt.py" = ["E501"]

[tool.mypy]
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "yaml", "pandas", "pandas.*", "anthropic", "openai", "typer", "rich", "rich.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "argus.cli"
disallow_untyped_decorators = false
